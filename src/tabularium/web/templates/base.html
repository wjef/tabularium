<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tabularium{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx-2.0.11.min.js" defer></script>
</head>
<body hx-headers='{"{{ csrf_header }}": "{{ csrf_token }}"}'>
  <header>
    <strong>Tabularium</strong>
    <nav>
      <a href="/">{{ _("Home") }}</a>
      <a href="/inbox">{{ _("To be tagged") }}</a>
      <a href="/tags">{{ _("Tags") }}</a>
      <a href="/entities">{{ _("Entities") }}</a>
      <a href="/history">{{ _("History") }}</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>v{{ version }}</footer>
</body>
</html>
