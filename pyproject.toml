[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tabularium"
version = "0.1.0"
description = "Local document archive with nested tags and entities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "platformdirs>=4.2",
    "babel>=2.15",
    "pydantic>=2.7",
    "python-multipart>=0.0.20",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.10",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx2>=2.13",
    "ruff>=0.6",
    "pre-commit>=4.0",
]

[project.scripts]
tabularium = "tabularium.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tabularium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
faulthandler_timeout = 60  # dump tracebacks if a test hangs

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"src/tabularium/migrations/**" = ["E501"]
"tests/**" = ["S105", "S106"]  # fake tokens in tests
