name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Full-history scan with the pinned, checksum-verified release binary
      # (gitleaks-action fails on a repository's first push).
      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1
